document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

code-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"45d7e251-74b5-4d3d-8d5a-9437b1540cf7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cfc82e87-d98c-4696-9942-fbbb8461bbbe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"45d7e251-74b5-4d3d-8d5a-9437b1540cf7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — Color tokens\n   Brand: electric azure → indigo gradient + sky sparkle accent.\n   Neutrals are subtly cool (blue-tinted slate).\n   Domain palettes (rating / sentiment / severity) are first-class\n   — Sira is a reputation & customer-intelligence product.\n   ============================================================ */\n:root {\n  /* ---- Brand (azure → indigo) ---- */\n  --brand-50:  #EAF1FE;\n  --brand-100: #D3E2FE;\n  --brand-200: #A9C5FD;\n  --brand-300: #79A3FB;\n  --brand-400: #4A82FA;\n  --brand-500: #1C67F9;   /* core brand blue */\n  --brand-600: #0F4FE6;\n  --brand-700: #0A3DC4;\n  --brand-800: #0C3097;\n  --brand-900: #0F2A73;\n\n  /* ---- Sky (sparkle / light accent) ---- */\n  --sky-300: #82CFFF;\n  --sky-400: #59BDF7;\n  --sky-500: #2FA3F0;\n\n  /* ---- Indigo (gradient terminal) ---- */\n  --indigo-500: #2A2AF0;\n  --indigo-600: #1414F0;\n  --indigo-700: #0E0EC4;\n\n  /* ---- Neutral (cool slate) ---- */\n  --neutral-0:   #FFFFFF;\n  --neutral-25:  #F8FAFD;\n  --neutral-50:  #F2F5FB;\n  --neutral-100: #E7ECF5;\n  --neutral-200: #D6DEEC;\n  --neutral-300: #BCC7DB;\n  --neutral-400: #94A1BC;\n  --neutral-500: #6A7790;\n  --neutral-600: #4C586F;\n  --neutral-700: #333E54;\n  --neutral-800: #1E2738;\n  --neutral-900: #0E1422;\n  --neutral-950: #070B14;\n\n  /* ---- Semantic hues ---- */\n  --green-50:  #E6F6F0;  --green-500: #10936A;  --green-600: #0E7C5A;\n  --amber-50:  #FDF3E2;  --amber-500: #E2A100;  --amber-600: #C28400;\n  --orange-50: #FDEDE2;  --orange-500: #F0742A; --orange-600: #D85E16;\n  --red-50:    #FCEBED;  --red-500:   #DC3A4B;  --red-600:   #C12333;\n  --gold-400:  #FFB627;  --gold-500:  #F5A623;  /* star rating */\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in product code\n     ============================================================ */\n\n  /* Surfaces & backgrounds */\n  --bg-app:        var(--neutral-25);\n  --bg-subtle:     var(--neutral-50);\n  --surface-card:  var(--neutral-0);\n  --surface-raised:var(--neutral-0);\n  --surface-sunken:var(--neutral-50);\n  --surface-inverse: var(--neutral-900);\n  --surface-brand-soft: var(--brand-50);\n\n  /* Borders */\n  --border-subtle:  var(--neutral-100);\n  --border-default: var(--neutral-200);\n  --border-strong:  var(--neutral-300);\n  --border-brand:   var(--brand-500);\n\n  /* Text */\n  --text-strong:   var(--neutral-900);\n  --text-body:     var(--neutral-700);\n  --text-muted:    var(--neutral-500);\n  --text-faint:    var(--neutral-400);\n  --text-on-brand: var(--neutral-0);\n  --text-link:     var(--brand-600);\n\n  /* Interactive accent */\n  --accent:        var(--brand-500);\n  --accent-hover:  var(--brand-600);\n  --accent-active: var(--brand-700);\n  --accent-soft:   var(--brand-50);\n  --focus-ring:    rgba(28,103,249,0.35);\n\n  /* Status (fg / soft-bg pairs) */\n  --success:       var(--green-600);   --success-soft: var(--green-50);\n  --warning:       var(--amber-600);   --warning-soft: var(--amber-50);\n  --danger:        var(--red-600);     --danger-soft:  var(--red-50);\n  --info:          var(--brand-600);   --info-soft:    var(--brand-50);\n\n  /* Rating */\n  --rating-on:  var(--gold-500);\n  --rating-off: var(--neutral-200);\n\n  /* Sentiment */\n  --sentiment-positive: var(--green-600);\n  --sentiment-neutral:  var(--neutral-400);\n  --sentiment-negative: var(--red-600);\n\n  /* Incident severity */\n  --severity-critical: var(--red-600);\n  --severity-high:     var(--orange-600);\n  --severity-medium:   var(--amber-600);\n  --severity-low:      var(--green-600);\n\n  /* Gradients & glows */\n  --gradient-brand: linear-gradient(135deg, #59BDF7 0%, #2A6BF7 46%, #1414F0 100%); /* @kind color */\n  --gradient-brand-soft: linear-gradient(135deg, #EAF1FE 0%, #D8ECFE 100%); /* @kind color */\n  --gradient-sheen: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0)); /* @kind color */\n  --glow-brand: 0 8px 28px -8px rgba(28,103,249,0.50); /* @kind shadow */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — Typography tokens\n   Display (Sora) for headings & numbers-with-presence.\n   Plus Jakarta Sans for all UI/body. JetBrains Mono for data.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;\n  --font-sans:    'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* Weights */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extra:    800; /* @kind font */\n\n  /* Type scale (1.250 major-third-ish, tuned) */\n  --fs-display-2xl: 60px;\n  --fs-display-xl:  48px;\n  --fs-display-lg:  38px;\n  --fs-heading-xl:  30px;\n  --fs-heading-lg:  24px;\n  --fs-heading-md:  20px;\n  --fs-heading-sm:  17px;\n  --fs-body-lg:     16px;\n  --fs-body-md:     14px;   /* default UI text */\n  --fs-body-sm:     13px;\n  --fs-caption:     12px;\n  --fs-micro:       11px;\n\n  /* Line heights */\n  --lh-tight:   1.08; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-normal:  1.5; /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tighter: -0.03em; /* @kind font */\n  --ls-tight:   -0.015em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-wide:    0.02em; /* @kind font */\n  --ls-caps:    0.08em; /* @kind font */\n\n  /* Semantic roles */\n  --text-display:   var(--fw-bold)     var(--fs-display-xl)/var(--lh-tight)  var(--font-display); /* @kind font */\n  --text-h1:        var(--fw-bold)     var(--fs-heading-xl)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-h2:        var(--fw-semibold) var(--fs-heading-lg)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-h3:        var(--fw-semibold) var(--fs-heading-md)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-body:      var(--fw-regular)  var(--fs-body-md)/var(--lh-normal)    var(--font-sans); /* @kind font */\n  --text-label:     var(--fw-semibold) var(--fs-body-sm)/var(--lh-snug)      var(--font-sans); /* @kind font */\n  --text-eyebrow:   var(--fw-bold)     var(--fs-caption)/var(--lh-snug)      var(--font-sans); /* @kind font */\n  --text-metric:    var(--fw-bold)     var(--fs-display-lg)/var(--lh-tight)  var(--font-display); /* @kind font */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — Spacing & layout tokens (4px base grid)\n   ============================================================ */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n  --space-11: 80px;\n  --space-12: 96px;\n\n  /* Component-level rhythm */\n  --gap-inline:   8px;    /* icon ↔ label */\n  --gap-stack:    12px;   /* form rows */\n  --pad-control:  10px 14px;   /* default input/button padding */\n  --pad-card:     20px;\n  --pad-card-lg:  28px;\n\n  /* Layout frame */\n  --sidebar-w:     264px;\n  --sidebar-w-collapsed: 76px;\n  --topbar-h:      64px;\n  --content-max:   1280px;\n  --container-pad: 24px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — Radius, border & elevation tokens\n   Generous, modern-SaaS rounding. Soft, cool-tinted shadows.\n   ============================================================ */\n:root {\n  /* Corner radii */\n  --radius-xs:   6px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;   /* default card */\n  --radius-xl:   20px;\n  --radius-2xl:  28px;\n  --radius-pill: 999px;\n  --radius-card: var(--radius-lg);\n\n  /* Border widths */\n  --border-1: 1px;\n  --border-2: 1.5px;\n\n  /* Elevation — cool slate shadows, never pure black */\n  --shadow-xs: 0 1px 2px rgba(13,24,48,0.06);\n  --shadow-sm: 0 1px 3px rgba(13,24,48,0.08), 0 1px 2px rgba(13,24,48,0.04);\n  --shadow-md: 0 6px 18px -6px rgba(13,24,48,0.14), 0 2px 6px -2px rgba(13,24,48,0.08);\n  --shadow-lg: 0 16px 40px -12px rgba(13,24,48,0.18), 0 4px 12px -4px rgba(13,24,48,0.10);\n  --shadow-xl: 0 28px 64px -16px rgba(13,24,48,0.24);\n\n  /* Focus + brand glows */\n  --shadow-focus: 0 0 0 4px var(--focus-ring);\n  --shadow-brand: var(--glow-brand);\n\n  /* Inset (sunken inputs, wells) */\n  --shadow-inset: inset 0 1px 2px rgba(13,24,48,0.06);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — Motion tokens\n   Calm, confident, productive. Quick ease-outs; springs reserved\n   for delightful confirmations (reply sent, sentiment shift).\n   No infinite decorative loops in product chrome.\n   ============================================================ */\n:root {\n  /* Durations */\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur-base:    220ms; /* @kind other */\n  --dur-slow:    340ms; /* @kind other */\n  --dur-slower:  520ms; /* @kind other */\n\n  /* Easings */\n  --ease-out:     cubic-bezier(0.22, 0.8, 0.28, 1);    /* @kind other */    /* enter / reveal */\n  --ease-in-out:  cubic-bezier(0.55, 0, 0.25, 1);      /* @kind other */    /* move / morph */\n  --ease-spring:  cubic-bezier(0.34, 1.45, 0.5, 1);    /* @kind other */    /* confirm / pop */\n  --ease-in:      cubic-bezier(0.5, 0, 0.85, 0.4);     /* @kind other */    /* exit */\n\n  /* Common transitions */\n  --transition-control: background-color var(--dur-fast) var(--ease-out),\n                         border-color var(--dur-fast) var(--ease-out),\n                         color var(--dur-fast) var(--ease-out),\n                         box-shadow var(--dur-fast) var(--ease-out),\n                         transform var(--dur-fast) var(--ease-out); /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Sira — base layer\n   Light resets + sensible document defaults that consume tokens.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font: var(--text-body);\n  color: var(--text-body) F2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"45d7e251-74b5-4d3d-8d5a-9437b1540cf7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Sira — Color tokens\n   Brand: electric azure → indigo gradient + sky sparkle accent.\n   Neutrals are subtly cool (blue-tinted slate).\n   Domain palettes (rating / sentiment / severity) are first-class\n   — Sira is a reputation & customer-intelligence product.\n   ============================================================ */\n:root {\n  /* ---- Brand (azure → indigo) ---- */\n  --brand-50:  #EAF1FE;\n  --brand-100: #D3E2FE;\n  --brand-200: #A9C5FD;\n  --brand-300: #79A3FB;\n  --brand-400: #4A82FA;\n  --brand-500: #1C67F9;   /* core brand blue */\n  --brand-600: #0F4FE6;\n  --brand-700: #0A3DC4;\n  --brand-800: #0C3097;\n  --brand-900: #0F2A73;\n\n  /* ---- Sky (sparkle / light accent) ---- */\n  --sky-300: #82CFFF;\n  --sky-400: #59BDF7;\n  --sky-500: #2FA3F0;\n\n  /* ---- Indigo (gradient terminal) ---- */\n  --indigo-500: #2A2AF0;\n  --indigo-600: #1414F0;\n  --indigo-700: #0E0EC4;\n\n  /* ---- Neutral (cool slate) ---- */\n  --neutral-0:   #FFFFFF;\n  --neutral-25:  #F8FAFD;\n  --neutral-50:  #F2F5FB;\n  --neutral-100: #E7ECF5;\n  --neutral-200: #D6DEEC;\n  --neutral-300: #BCC7DB;\n  --neutral-400: #94A1BC;\n  --neutral-500: #6A7790;\n  --neutral-600: #4C586F;\n  --neutral-700: #333E54;\n  --neutral-800: #1E2738;\n  --neutral-900: #0E1422;\n  --neutral-950: #070B14;\n\n  /* ---- Semantic hues ---- */\n  --green-50:  #E6F6F0;  --green-500: #10936A;  --green-600: #0E7C5A;\n  --amber-50:  #FDF3E2;  --amber-500: #E2A100;  --amber-600: #C28400;\n  --orange-50: #FDEDE2;  --orange-500: #F0742A; --orange-600: #D85E16;\n  --red-50:    #FCEBED;  --red-500:   #DC3A4B;  --red-600:   #C12333;\n  --gold-400:  #FFB627;  --gold-500:  #F5A623;  /* star rating */\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in product code\n     ============================================================ */\n\n  /* Surfaces & backgrounds */\n  --bg-app:        var(--neutral-25);\n  --bg-subtle:     var(--neutral-50);\n  --surface-card:  var(--neutral-0);\n  --surface-raised:var(--neutral-0);\n  --surface-sunken:var(--neutral-50);\n  --surface-inverse: var(--neutral-900);\n  --surface-brand-soft: var(--brand-50);\n\n  /* Borders */\n  --border-subtle:  var(--neutral-100);\n  --border-default: var(--neutral-200);\n  --border-strong:  var(--neutral-300);\n  --border-brand:   var(--brand-500);\n\n  /* Text */\n  --text-strong:   var(--neutral-900);\n  --text-body:     var(--neutral-700);\n  --text-muted:    var(--neutral-500);\n  --text-faint:    var(--neutral-400);\n  --text-on-brand: var(--neutral-0);\n  --text-link:     var(--brand-600);\n\n  /* Interactive accent */\n  --accent:        var(--brand-500);\n  --accent-hover:  var(--brand-600);\n  --accent-active: var(--brand-700);\n  --accent-soft:   var(--brand-50);\n  --focus-ring:    rgba(28,103,249,0.35);\n\n  /* Status (fg / soft-bg pairs) */\n  --success:       var(--green-600);   --success-soft: var(--green-50);\n  --warning:       var(--amber-600);   --warning-soft: var(--amber-50);\n  --danger:        var(--red-600);     --danger-soft:  var(--red-50);\n  --info:          var(--brand-600);   --info-soft:    var(--brand-50);\n\n  /* Rating */\n  --rating-on:  var(--gold-500);\n  --rating-off: var(--neutral-200);\n\n  /* Sentiment */\n  --sentiment-positive: var(--green-600);\n  --sentiment-neutral:  var(--neutral-400);\n  --sentiment-negative: var(--red-600);\n\n  /* Incident severity */\n  --severity-critical: var(--red-600);\n  --severity-high:     var(--orange-600);\n  --severity-medium:   var(--amber-600);\n  --severity-low:      var(--green-600);\n\n  /* Gradients & glows */\n  --gradient-brand: linear-gradient(135deg, #59BDF7 0%, #2A6BF7 46%, #1414F0 100%); /* @kind color */\n  --gradient-brand-soft: linear-gradient(135deg, #EAF1FE 0%, #D8ECFE 100%); /* @kind color */\n  --gradient-sheen: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0)); /* @kind color */\n  --glow-brand: 0 8px 28px -8px rgba(28,103,249,0.50); /* @kind shadow */\n}\n\n/* ============================================================\n   Sira — Typography tokens\n   Display (Sora) for headings & numbers-with-presence.\n   Plus Jakarta Sans for all UI/body. JetBrains Mono for data.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;\n  --font-sans:    'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* Weights */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extra:    800; /* @kind font */\n\n  /* Type scale (1.250 major-third-ish, tuned) */\n  --fs-display-2xl: 60px;\n  --fs-display-xl:  48px;\n  --fs-display-lg:  38px;\n  --fs-heading-xl:  30px;\n  --fs-heading-lg:  24px;\n  --fs-heading-md:  20px;\n  --fs-heading-sm:  17px;\n  --fs-body-lg:     16px;\n  --fs-body-md:     14px;   /* default UI text */\n  --fs-body-sm:     13px;\n  --fs-caption:     12px;\n  --fs-micro:       11px;\n\n  /* Line heights */\n  --lh-tight:   1.08; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-normal:  1.5; /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tighter: -0.03em; /* @kind font */\n  --ls-tight:   -0.015em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-wide:    0.02em; /* @kind font */\n  --ls-caps:    0.08em; /* @kind font */\n\n  /* Semantic roles */\n  --text-display:   var(--fw-bold)     var(--fs-display-xl)/var(--lh-tight)  var(--font-display); /* @kind font */\n  --text-h1:        var(--fw-bold)     var(--fs-heading-xl)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-h2:        var(--fw-semibold) var(--fs-heading-lg)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-h3:        var(--fw-semibold) var(--fs-heading-md)/var(--lh-snug)   var(--font-display); /* @kind font */\n  --text-body:      var(--fw-regular)  var(--fs-body-md)/var(--lh-normal)    var(--font-sans); /* @kind font */\n  --text-label:     var(--fw-semibold) var(--fs-body-sm)/var(--lh-snug)      var(--font-sans); /* @kind font */\n  --text-eyebrow:   var(--fw-bold)     var(--fs-caption)/var(--lh-snug)      var(--font-sans); /* @kind font */\n  --text-metric:    var(--fw-bold)     var(--fs-display-lg)/var(--lh-tight)  var(--font-display); /* @kind font */\n}\n\n/* ============================================================\n   Sira — Spacing & layout tokens (4px base grid)\n   ============================================================ */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n  --space-11: 80px;\n  --space-12: 96px;\n\n  /* Component-level rhythm */\n  --gap-inline:   8px;    /* icon ↔ label */\n  --gap-stack:    12px;   /* form rows */\n  --pad-control:  10px 14px;   /* default input/button padding */\n  --pad-card:     20px;\n  --pad-card-lg:  28px;\n\n  /* Layout frame */\n  --sidebar-w:     264px;\n  --sidebar-w-collapsed: 76px;\n  --topbar-h:      64px;\n  --content-max:   1280px;\n  --container-pad: 24px;\n}\n\n/* ============================================================\n   Sira — Radius, border & elevation tokens\n   Generous, modern-SaaS rounding. Soft, cool-tinted shadows.\n   ============================================================ */\n:root {\n  /* Corner radii */\n  --radius-xs:   6px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;   /* default card */\n  --radius-xl:   20px;\n  --radius-2xl:  28px;\n  --radius-pill: 999px;\n  --radius-card: var(--radius-lg);\n\n  /* Border widths */\n  --border-1: 1px;\n  --border-2: 1.5px;\n\n  /* Elevation — cool slate shadows, never pure black */\n  --shadow-xs: 0 1px 2px rgba(13,24,48,0.06);\n  --shadow-sm: 0 1px 3px rgba(13,24,48,0.08), 0 1px 2px rgba(13,24,48,0.04);\n  --shadow-md: 0 6px 18px -6px rgba(13,24,48,0.14), 0 2px 6px -2px rgba(13,24,48,0.08);\n  --shadow-lg: 0 16px 40px -12px rgba(13,24,48,0.18), 0 4px 12px -4px rgba(13,24,48,0.10);\n  --shadow-xl: 0 28px 64px -16px rgba(13,24,48,0.24);\n\n  /* Focus + brand glows */\n  --shadow-focus: 0 0 0 4px var(--focus-ring);\n  --shadow-brand: var(--glow-brand);\n\n  /* Inset (sunken inputs, wells) */\n  --shadow-inset: inset 0 1px 2px rgba(13,24,48,0.06);\n}\n\n/* ============================================================\n   Sira — Motion tokens\n   Calm, confident, productive. Quick ease-outs; springs reserved\n   for delightful confirmations (reply sent, sentiment shift).\n   No infinite decorative loops in product chrome.\n   ============================================================ */\n:root {\n  /* Durations */\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur-base:    220ms; /* @kind other */\n  --dur-slow:    340ms; /* @kind other */\n  --dur-slower:  520ms; /* @kind other */\n\n  /* Easings */\n  --ease-out:     cubic-bezier(0.22, 0.8, 0.28, 1);    /* @kind other */    /* enter / reveal */\n  --ease-in-out:  cubic-bezier(0.55, 0, 0.25, 1);      /* @kind other */    /* move / morph */\n  --ease-spring:  cubic-bezier(0.34, 1.45, 0.5, 1);    /* @kind other */    /* confirm / pop */\n  --ease-in:      cubic-bezier(0.5, 0, 0.85, 0.4);     /* @kind other */    /* exit */\n\n  /* Common transitions */\n  --transition-control: background-color var(--dur-fast) var(--ease-out),\n                         border-color var(--dur-fast) var(--ease-out),\n                         color var(--dur-fast) var(--ease-out),\n                         box-shadow var(--dur-fast) var(--ease-out),\n                         transform var(--dur-fast) var(--ease-out); /* @kind other */\n}\n\n/* ============================================================\n   Sira — base layer\n   Light resets + sensible document defaults that consume tokens.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font: var(--text-body);\n  color: var(--text-body);\n  background: var(--bg-app);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"ss01\", \"cv01\";\n}\n\nh1, h2, h3, h4 {\n  margin: 0;\n  color: var(--text-strong);\n  font-family: var(--font-display);\n  letter-spacing: var(--ls-tight);\n  text-wrap: balance;\n}\n\np { margin: 0; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n::selection { background: var(--brand-200); color: var(--neutral-900); }\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--shadow-focus);\n  border-radius: var(--radius-sm);\n}\n\nbutton { font-family: inherit; }\n\ncode, kbd, samp { font-family: var(--font-mono); font-size: 0.9em; }\n\n/* Numeric tabular alignment helper for metrics/tables */\n.tabular { font-variant-numeric: tabular-nums; font-feature-settings: \"tnum\"; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !i el-on-change=\"{{ sel.onFeedback }}\" rows=\"4\" placeholder=\"What happened, who to follow up with, next step…\" style=\"width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px; line-height: 1.5; color: var(--neutral-800); background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 10px; padding: 9px 11px; resize: vertical;\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;\">Assign to<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;\">\n                  <sc-for list=\"{{ sel.aeChoices }}\" as=\"a\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ a.set }}\" title=\"{{ a.full }}\" style=\"min-width: 0; cursor: pointer; background: {{ a.bg }}; color: {{ a.fg }}; border: 1px solid {{ a.bd }}; border-radius: 9px; padding: 8px 6px; font-size: 12px; font-weight: 700; font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ a.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size: 11px; color: var(--text-muted); margin-top: 6px;\">Preferred AE in sheet: {{ sel.pref }}. Your changes stay saved on this device.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ sel.hs }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ sel.hs }}\" target=\"_blank\" style=\"display: block; text-align: center; background: var(--brand-500); color: #ffffff; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 700;\" style-hover=\"background: var(--brand-600); color: #ffffff; text-decoration: none;\">Open in HubSpot<\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noSel }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: none;\">\n          <div style=\"font-family: 'Sora', system-ui, sans-serif; font-size: 16px; font-weight: 600; color: var(--text-strong);\">Click a meeting<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-muted); line-height: 1.55;\">Every slot opens the full briefing: score and tier, who is coming with titles and contact details, the SDR note, deal history, what to ask for, and a link straight to the HubSpot record.<\u002Fdiv>\n          <div style=\"border-top: 1px solid var(--border-subtle); padding-top: 14px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);\">Top priorities today<\u002Fdiv>\n            <sc-for list=\"{{ top }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ t.open }}\" style=\"cursor: pointer; display: flex; align-items: baseline; gap: 9px; padding: 6px 8px; border-radius: 9px;\" style-hover=\"background: var(--neutral-50);\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; color: var(--brand-600); flex: none;\">{{ t.time }}<\u002Fspan>\n                <span style=\"font-size: 12.5px; color: var(--neutral-800); line-height: 1.35; min-width: 0;\">{{ t.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--surface-card); border: 1px solid var(--gold-500); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 18px 20px;\">\n      <sc-if value=\"{{ hasOverlaps }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px;\">\n          <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--danger);\">More meetings than AEs — {{ overlapCount }} slots<\u002Fspan>\n          <sc-if value=\"{{ showDayWideNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 11px; color: var(--text-muted);\">{{ dayWideNote }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5;\">Times are never changed. Where an AE was booked twice at once the meeting moved to a free AE instead — the panel's Slot shown line names the swap. These slots have more bookings than there are AEs, so all three are already busy — every meeting past the first in each slot needs a new time from the SDR or a fourth person in the room.<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 7px; margin-bottom: 18px;\">\n          <sc-for list=\"{{ overlaps }}\" as=\"o\" hint-placeholder-count=\"8\">\n            <div style=\"display: flex; gap: 9px; align-items: baseline;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; color: var(--danger); flex: none;\">{{ o.time }}<\u002Fspan>\n              <span style=\"min-width: 0;\">\n                <span style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--text-strong); line-height: 1.3;\">{{ o.ae }}<\u002Fspan>\n                <span style=\"display: block; font-size: 11.5px; color: var(--text-muted);\">{{ o.cos }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasGaps }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px;\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-strong);\">Needs a confirmed time — {{ gapLabel }}<\u002Fspan>\n        <sc-if value=\"{{ showDayWideNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 11px; color: var(--text-muted);\">{{ dayWideNote }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5;\">Every meeting now carries its SDR note, score and HubSpot summary. These are the ones with no booked time in HubSpot or a time the contact still has to confirm on the day — the slots shown for them are placeholders.<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 7px;\">\n        <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"12\">\n          <div style=\"display: flex; gap: 9px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; color: var(--brand-600); flex: none;\">{{ g.time }}<\u002Fspan>\n            <span style=\"min-width: 0;\">\n              <span style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--text-strong); line-height: 1.3;\">{{ g.co }}<\u002Fspan>\n              <span style=\"display: block; font-size: 11.5px; color: var(--text-muted);\">{{ g.ae }} · {{ g.missing }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1640},&quot;showReassignments&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Calendar&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: null, sel: null, edits: {}, copied: '', tab: 'calendar', sdrFilter: '', who: '', sync: '', syncAt: '', dirty: false };\n  KEY = 'ffcc-calendar-edits-v1';\n  AE_OPTIONS = ['Yasser Hashesh', 'Mohamed Hassan', 'Youssef Elnahal', 'Marwan Mansi', 'Fairouz'];\n  STATUS_OPTIONS = ['Confirmed', 'Not yet', 'Will pass by'];\n  PRIO_OPTIONS = ['High', 'Medium', 'Low'];\n  FLEX_OPTIONS = ['Flexible', 'Strict'];\n  OUTCOME_OPTIONS = ['Completed', 'Rescheduled', 'No show'];\n  SDR_TONE = {\n    'Doaa Gamal':     { bg: 'var(--brand-50)',    fg: 'var(--brand-700)',   bd: 'var(--brand-400)' },\n    'Naira Mohamed':  { bg: 'var(--green-50)',    fg: 'var(--success)',     bd: 'var(--green-500)' },\n    'Khaled El-Sayed':{ bg: 'var(--amber-50)',    fg: 'var(--text-strong)', bd: 'var(--gold-500)' },\n    'omnia salah':    { bg: 'var(--red-50)',      fg: 'var(--danger)',      bd: 'var(--red-500)' },\n    'fairoz taha':    { bg: 'var(--surface-sunken)', fg: 'var(--neutral-700)', bd: 'var(--border-strong)' }\n  };\n  sdrTone(n) { return this.SDR_TONE[n] || { bg: 'var(--surface-sunken)', fg: 'var(--neutral-700)', bd: 'var(--border-default)' }; }\n  OUTCOME_TONE = {\n    Completed: { bg: 'var(--success-soft)', fg: 'var(--success)', bd: 'var(--green-500)' },\n    Rescheduled: { bg: 'var(--amber-50)', fg: 'var(--text-strong)', bd: 'var(--gold-500)' },\n    'No show': { bg: 'var(--danger-soft)', fg: 'var(--danger)', bd: 'var(--red-500)' }\n  };\n  FLEX_TONE = {\n    Flexible: { bg: 'transparent', fg: 'var(--brand-700)', bd: 'var(--brand-400)' },\n    Strict: { bg: 'transparent', fg: 'var(--neutral-700)', bd: 'var(--border-default)' }\n  };\n  PRIO_TONE = {\n    High: { bg: 'var(--danger-soft)', fg: 'var(--danger)', bd: 'var(--red-500)' },\n    Medium: { bg: 'var(--amber-50)', fg: 'var(--text-strong)', bd: 'var(--gold-500)' },\n    Low: { bg: 'var(--surface-sunken)', fg: 'var(--neutral-700)', bd: 'var(--border-default)' }\n  };\n\n  ENDPOINT = 'https://script.google.com/macros/s/AKfycbxuQYojm9jnXAhCyX72zrGlffwY3wKq7k_QKHwEkv3CfDJpvpZj0QFe4pUx5rleDWeFPw/exec';\n  WHO_KEY = 'ffcc-who';\n\n  componentDidMount() {\n    let edits = {};\n    try { edits = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) { edits = {}; }\n    let who = '';\n    try { who = localStorage.getItem(this.WHO_KEY) || ''; } catch (e) {}\n    const saved = document.getElementById('ffcc-edits');\n    if (saved) {\n      try {\n        const d = JSON.parse(saved.textContent);\n        edits = { ...edits, ...(d.edits || {}) };\n        who = who || d.who || '';\n      } catch (e) {}\n    }\n    this.setState({ edits, who });\n    let stored = null;\n    try { stored = JSON.parse(localStorage.getItem(this.VIEW_KEY) || 'null'); } catch (e) {}\n    if (stored && stored.all && stored.slots) this.setState({ view: stored });\n    else {\n      const inline = document.getElementById('ffcc-data');\n      if (inline) { try { this.setState({ view: JSON.parse(inline.textContent) }); } catch (e) {} }\n      if (!this.state.view) fetch('data/calendar-v2.json').then(r => r.json()).then(view => this.setState({ view }));\n    }\n    this.pull();\n    this.timer = setInterval(() => this.pull(), 30000);\n    this.onVis = () => { if (!document.hidden) this.pull(); };\n    document.addEventListener('visibilitychange', this.onVis);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    if (this.onVis) document.removeEventListener('visibilitychange', this.onVis);\n  }\n\n  /* Apps Script blocks cross-origin reads, so both directions ride on a JSONP <script> tag. */\n  jsonp(params) {\n    return new Promise((resolve, reject) => {\n      const cb = 'ffcc_cb_' + Math.random().toString(36).slice(2);\n      const url = this.ENDPOINT + '?callback=' + cb + '&t=' + Date.now() +\n        Object.keys(params).map(k => '&' + k + '=' + encodeURIComponent(params[k] == null ? '' : params[k])).join('');\n      const s = document.createElement('script');\n      let done = false;\n      const clean = () => {\n        if (done) return; done = true;\n        clearTimeout(timer);\n        try { delete window[cb]; } catch (e) { window[cb] = undefined; }\n        if (s.parentNode) s.parentNode.removeChild(s);\n      };\n      const timer = setTimeout(() => { if (!done) { clean(); reject(new Error('timeout')); } }, 30000);\n      window[cb] = d => { if (!done) { clean(); resolve(d); } };\n      s.onerror = s.onabort = () => { if (!done) { clean(); reject(new Error('load')); } };\n      s.src = url;\n      document.head.appendChild(s);\n    });\n  }\n  stamp() { return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }\n\n  pull() {\n    if (this.state.dirty || this.pulling) return;\n    this.pulling = true;\n    if (this.state.sync !== 'ok') this.setState({ sync: 'connecting' });\n    this.jsonp({}).then(d => {\n      this.pulling = false;\n      if (!d || !d.edits) return;\n      const merged = { ...this.state.edits };\n      Object.keys(d.edits).forEach(co => {\n        const r = d.edits[co];\n        merged[co] = {\n          status: r.status || '', prio: r.priority || '', flex: r.timing || '',\n          outcome: r.outcome || '', feedback: r.feedback || '', by: r.by || '', at: r.at || ''\n        };\n      });\n      this.fails = 0;\n      this.setState({ edits: merged, sync: 'ok', syncAt: this.stamp() });\n      try { localStorage.setItem(this.KEY, JSON.stringify(merged)); } catch (e) {}\n    }).catch(() => {\n      this.pulling = false;\n      this.fails = (this.fails || 0) + 1;\n      if (this.fails >= 2) this.setState({ sync: 'off' });\n      if (this.fails < 4) setTimeout(() => this.pull(), 4000);\n    });\n  }\n  push(co) {\n    const e = this.state.edits[co] || {};\n    this.setState({ sync: 'saving', dirty: true });\n    this.jsonp({\n      save: 1, company: co, status: e.status || '', priority: e.prio || '', timing: e.flex || '',\n      outcome: e.outcome || '', feedback: e.feedback || '', by: this. <script>
  (function initLiveSync() {
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCbt3T4MzIiNiao3V3_FOmbtI-YyZuD5P-77HEtaMjoPvsQnozoOZ8oLpK9VelmpXv7g/exec';
    let previousSnapshot = '';

    async function checkForUpdates() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        if (!response.ok) return;

        const freshData = await response.json();
        const currentSnapshot = JSON.stringify(freshData);

        // Update the page only when changes are detected in Google Sheets
        if (previousSnapshot && currentSnapshot !== previousSnapshot) {
          console.log('Sheet change detected! Refreshing data...');

          // Triggers page update depending on your app's main function
          if (typeof render === 'function') {
            render(freshData);
          } else if (typeof renderSchedule === 'function') {
            renderSchedule(freshData);
          } else {
            // Fallback: refreshes the view seamlessly
            window.location.reload();
          }
        }

        previousSnapshot = currentSnapshot;
      } catch (err) {
        console.warn('Auto-sync poll attempt failed:', err);
      }
    }

    // Check for edits every 5 seconds (5000 ms)
    setInterval(checkForUpdates, 5000);
  })();
